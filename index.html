<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>HADO 回避トレーニング v3 - 学習AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --vh: 1vh;
        }
        
        html, body {
            height: 100%;
            height: -webkit-fill-available;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
        }
        
        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container.training-mode { 
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body.training-active {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        header { text-align: center; margin-bottom: 20px; }
        .container.training-mode header { display: none; }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: 4px;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }
        
        .subtitle { font-size: 1rem; color: #888; letter-spacing: 3px; margin-top: 5px; }
        
        .main-area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container.training-mode .main-area { width: 100%; height: 100vh; }
        
        .video-container {
            position: relative;
            border: 2px solid #00ffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.1);
        }
        
        .container.training-mode .video-container {
            width: 100%; height: 100%;
            border: none; border-radius: 0;
        }
        
        #videoElement {
            display: block;
            transform: scaleX(-1);
            width: 640px; height: 480px;
            max-width: 100%;
        }
        
        .container.training-mode #videoElement {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            max-width: none;
            object-fit: cover;
            z-index: 1;
        }
        
        #canvas {
            position: absolute;
            top: 0; left: 0;
            transform: scaleX(-1);
            width: 640px; height: 480px;
            max-width: 100%;
        }
        
        .container.training-mode #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            max-width: none;
            z-index: 2;
        }
        
        .distance-warning {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            background: rgba(255, 100, 0, 0.9);
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        
        .distance-warning.show { opacity: 1; }
        
        .timer-display {
            position: absolute;
            top: 20px; right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            z-index: 100;
        }
        
        .timer-display.warning {
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            animation: timerPulse 0.5s ease infinite;
        }
        
        .timer-display.critical {
            color: #ff0066;
            text-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
            animation: timerPulse 0.3s ease infinite;
        }
        
        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .score-display {
            position: absolute;
            top: 20px; left: 20px;
            font-family: 'Orbitron', sans-serif;
            z-index: 100;
        }
        
        .score-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .score-label { font-size: 0.9rem; color: #888; }
        .score-value { font-size: 2rem; font-weight: 900; }
        .score-value.success { color: #00ff88; }
        .score-value.fail { color: #ff0066; }
        
        .life-display {
            position: absolute;
            top: 120px; left: 20px;
            z-index: 100;
        }
        
        .life-indicator {
            width: 70px; height: 70px;
            position: relative;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
        }
        
        .life-quarter {
            position: absolute;
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            transition: all 0.3s;
        }
        
        .life-quarter.top {
            top: 5px; left: 50%;
            transform: translateX(-50%);
            border-radius: 50% 50% 0 0;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }
        
        .life-quarter.right {
            top: 50%; right: 5px;
            transform: translateY(-50%);
            border-radius: 0 50% 50% 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }
        
        .life-quarter.bottom {
            bottom: 5px; left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 50% 50%;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }
        
        .life-quarter.left {
            top: 50%; left: 5px;
            transform: translateY(-50%);
            border-radius: 50% 0 0 50%;
            clip-path: polygon(100% 50%, 0 0, 0 100%);
        }
        
        .life-quarter.lost { background: rgba(100, 100, 100, 0.3); box-shadow: none; }
        
        .ai-level-display {
            position: absolute;
            top: 210px; left: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #ff00ff;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 255, 0.5);
            z-index: 100;
        }
        
        .ai-level-display .level-name {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .ai-learning-display {
            position: absolute;
            top: 260px; left: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: #ffaa00;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 170, 0, 0.5);
            z-index: 100;
            max-width: 180px;
        }
        
        .ai-learning-display .learning-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .ai-learning-display .tendency {
            font-size: 0.75rem;
            color: #ccc;
            line-height: 1.4;
        }
        
        .stop-training-btn {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: rgba(255, 0, 102, 0.8);
            border: 2px solid #ff0066;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        
        .stop-training-btn:hover {
            background: rgba(255, 0, 102, 1);
            box-shadow: 0 0 30px rgba(255, 0, 102, 0.6);
        }
        
        .control-panel {
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.9), rgba(10, 10, 20, 0.95));
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            min-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
        }
        
        .container.training-mode .control-panel { display: none; }
        
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .panel-title.ai { color: #ff00ff; border-color: rgba(255, 0, 255, 0.3); }
        .panel-title.learning { color: #ffaa00; border-color: rgba(255, 170, 0, 0.3); }
        
        .slider-group { margin-bottom: 20px; }
        
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }
        
        .slider-group label span { color: #00ffff; font-family: 'Orbitron', sans-serif; }
        .slider-group label span.ai-value { color: #ff00ff; }
        .slider-group label span.learn-value { color: #ffaa00; }
        
        .slider-group .description {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        input[type="range"] {
            width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        input[type="range"].ai-slider::-webkit-slider-thumb {
            background: linear-gradient(135deg, #ff00ff, #ff0066);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }
        
        input[type="range"].learn-slider::-webkit-slider-thumb {
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }
        
        .btn {
            width: 100%;
            padding: 18px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }
        
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #ff0066;
            animation: statusPulse 1s ease infinite;
        }
        
        .status-dot.ready { background: #00ff88; }
        
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-text { font-size: 0.9rem; color: #888; }
        
        .result-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .result-screen.show { opacity: 1; pointer-events: auto; }
        
        .result-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .result-stat {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        
        .result-stat-label { font-size: 1rem; color: #888; margin-bottom: 10px; }
        .result-stat-value { font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900; }
        .result-stat-value.cyan { color: #00ffff; }
        .result-stat-value.green { color: #00ff88; }
        .result-stat-value.magenta { color: #ff0066; }
        .result-stat-value.yellow { color: #ffff00; }
        
        .btn-restart {
            padding: 20px 60px;
            background: linear-gradient(135deg, #00ffff, #00cccc);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            transition: all 0.2s;
        }
        
        .btn-restart:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 255, 255, 0.6); }
        
        .permission-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 40px;
        }
        
        .permission-screen.hidden { display: none; }
        
        .permission-icon {
            width: 100px; height: 100px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .permission-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .permission-text {
            font-size: 1rem;
            color: #888;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .btn-allow {
            padding: 18px 50px;
            background: linear-gradient(135deg, #00ffff, #00cccc);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            transition: all 0.2s;
        }
        
        .btn-allow:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 255, 255, 0.6); }
        
        .countdown-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
        }
        
        .countdown-overlay.show { opacity: 1; pointer-events: auto; }
        
        .countdown-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 15rem;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
            animation: countdownPop 1s ease;
        }
        
        @keyframes countdownPop {
            0% { transform: scale(2); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        
        .hit-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 500;
        }
        
        .hit-flash.success {
            background: radial-gradient(circle, rgba(0, 255, 136, 0.4) 0%, transparent 70%);
            animation: flashEffect 0.3s ease;
        }
        
        .hit-flash.fail {
            background: radial-gradient(circle, rgba(255, 0, 102, 0.4) 0%, transparent 70%);
            animation: flashEffect 0.3s ease;
        }
        
        @keyframes flashEffect {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .ko-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 0, 102, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 600;
            opacity: 0;
            pointer-events: none;
        }
        
        .ko-overlay.show { animation: koFlash 1.5s ease forwards; }
        
        @keyframes koFlash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .ko-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: #ff0066;
            text-shadow: 0 0 50px rgba(255, 0, 102, 0.8);
        }
        
        /* モバイル対応 */
        @media screen and (max-width: 768px) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }
            
            .container {
                padding: 10px;
                min-height: auto;
            }
            
            h1 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            
            .main-area {
                flex-direction: column;
                gap: 15px;
            }
            
            .video-container {
                width: 100%;
                max-width: 100%;
            }
            
            #videoElement {
                width: 100%;
                height: auto;
                max-height: 40vh;
            }
            
            #canvas {
                width: 100%;
                height: auto;
                max-height: 40vh;
            }
            
            .control-panel {
                min-width: auto;
                width: 100%;
                max-height: none;
                padding: 15px;
            }
            
            .panel-title {
                font-size: 1rem;
                margin-bottom: 15px;
            }
            
            .slider-group {
                margin-bottom: 15px;
            }
            
            .slider-group label {
                font-size: 0.9rem;
            }
            
            input[type="range"] {
                height: 8px;
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 24px;
                height: 24px;
            }
            
            .btn {
                padding: 15px;
                font-size: 1rem;
            }
            
            .status {
                padding: 12px;
            }
            
            /* トレーニング中のモバイルUI */
            .timer-display {
                font-size: 2rem;
                top: 10px;
                right: 10px;
            }
            
            .score-display {
                top: 10px;
                left: 10px;
            }
            
            .score-item {
                margin-bottom: 5px;
                gap: 5px;
            }
            
            .score-label {
                font-size: 0.7rem;
            }
            
            .score-value {
                font-size: 1.3rem;
            }
            
            .life-display {
                top: 80px;
                left: 10px;
            }
            
            .life-indicator {
                width: 50px;
                height: 50px;
            }
            
            .life-quarter {
                width: 20px;
                height: 20px;
            }
            
            .ai-level-display {
                top: 145px;
                left: 10px;
                font-size: 0.65rem;
                padding: 5px 8px;
            }
            
            .ai-level-display .level-name {
                font-size: 0.85rem;
            }
            
            .ai-learning-display {
                top: 185px;
                left: 10px;
                font-size: 0.6rem;
                padding: 5px 8px;
                max-width: 140px;
            }
            
            .ai-learning-display .learning-title {
                font-size: 0.7rem;
            }
            
            .ai-learning-display .tendency {
                font-size: 0.6rem;
            }
            
            .distance-warning {
                top: 50px;
                font-size: 0.8rem;
                padding: 8px 15px;
            }
            
            .stop-training-btn {
                bottom: 20px;
                padding: 12px 30px;
                font-size: 0.9rem;
            }
            
            /* 結果画面のモバイル対応 */
            .result-title {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            
            .result-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 0 15px;
                margin-bottom: 25px;
            }
            
            .result-stat {
                padding: 15px 10px;
            }
            
            .result-stat-label {
                font-size: 0.8rem;
            }
            
            .result-stat-value {
                font-size: 2rem;
            }
            
            .btn-restart {
                padding: 15px 40px;
                font-size: 1rem;
            }
            
            /* カウントダウン */
            .countdown-number {
                font-size: 8rem;
            }
            
            /* K.O. */
            .ko-text {

    <script>
        let faceDetection;
        let isRunning = false;
        let currentFacePosition = null;
        let lastKnownFacePosition = null;
        let currentFaceSize = 0;
        
        // 改善された予測システム
        const HISTORY_SIZE = 30;
        let positionHistory = [];
        
        let smoothedVelocity = { x: 0, y: 0 };
        let smoothedAcceleration = { x: 0, y: 0 };
        const VELOCITY_SMOOTHING = 0.3;
        const ACCEL_SMOOTHING = 0.2;
        const MAX_VELOCITY_RATIO = 1.5;
        
        // 学習システム（相対位置ベース）
        let shotCount = 0;  // 発射した弾の数
        let dodgeHistory = [];  // 回避履歴: { relativeVector, timestamp }
        let averageDodgeVector = { x: 0, y: 0 };  // 平均回避ベクトル
        let lastDodgeVector = null;  // 直前の回避ベクトル
        let afterDodgePatterns = [];  // 直前の回避後のパターン
        let learningStrength = 0.7;
        
        let trainingTimer = null;
        let fireTimer = null;
        let remainingTime = 80;
        let activeBullets = [];
        
        let lives = [true, true, true, true];
        let koCount = 0;
        let respawnTimer = null;
        let isRespawning = false;
        
        let successCount = 0;
        let failCount = 0;
        let reactionTimes = [];
        
        // 弾パラメータ
        let impactTime = 1200;
        let bulletSize = 80;
        let fireInterval = 2000;
        let aimOffset = 50;
        let maxBurstCount = 3;
        
        // 予測AIパラメータ
        let predictionLevel = 3;
        let predictionNoise = 0.15;
        
        const PREDICTION_LEVELS = [
            { name: 'OFF', factor: 0, description: '予測なし - 現在位置を狙う' },
            { name: 'Lv.1 初級', factor: 0.4, description: '少しだけ動きを読む' },
            { name: 'Lv.2 中級', factor: 0.6, description: '動きの半分以上を予測する' },
            { name: 'Lv.3 読み', factor: 0.85, description: '移動方向を読んで先回りする' },
            { name: 'Lv.4 達人', factor: 1.0, description: '着弾時の位置を完全予測' },
            { name: 'Lv.5 超越', factor: 1.2, description: '動きの先の先を読む' }
        ];
        
        const BURST_DELAY = 550;
        const IDEAL_FACE_MIN = 0.15;
        const IDEAL_FACE_MAX = 0.35;
        const QUADRANT_GAP = 0.08;
        
        const QUADRANTS = [
            { name: 'top', startAngle: -Math.PI * 0.75, endAngle: -Math.PI * 0.25 },
            { name: 'right', startAngle: -Math.PI * 0.25, endAngle: Math.PI * 0.25 },
            { name: 'bottom', startAngle: Math.PI * 0.25, endAngle: Math.PI * 0.75 },
            { name: 'left', startAngle: Math.PI * 0.75, endAngle: Math.PI * 1.25 }
        ];
        
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 回避方向を分類（表示用）
        function classifyDodgeDirection(dx, dy) {
            const angle = Math.atan2(dy, dx);
            if (angle >= -Math.PI/4 && angle < Math.PI/4) return '→';
            if (angle >= Math.PI/4 && angle < 3*Math.PI/4) return '↓';
            if (angle >= -3*Math.PI/4 && angle < -Math.PI/4) return '↑';
            return '←';
        }
        
        // 回避パターンを学習（相対位置ベース）
        function learnDodgePattern(bullet, facePos) {
            if (!facePos || !bullet.originalTarget) return;
            
            // 相対回避ベクトル = 現在の顔位置 - 元の狙い位置
            const relativeX = facePos.x - bullet.originalTarget.x;
            const relativeY = facePos.y - bullet.originalTarget.y;
            const dodgeDist = Math.hypot(relativeX, relativeY);
            
            // 十分な回避距離がある場合のみ学習
            if (dodgeDist < 20) return;
            
            const currentVector = { x: relativeX, y: relativeY };
            
            // 直前の回避ベクトルからの変化パターンを記録
            if (lastDodgeVector) {
                afterDodgePatterns.push({
                    prev: { ...lastDodgeVector },
                    next: { ...currentVector }
                });
                // 直近10回分を保持
                if (afterDodgePatterns.length > 10) {
                    afterDodgePatterns.shift();
                }
            }
            
            // 履歴に追加
            dodgeHistory.push({
                vector: currentVector,
                timestamp: Date.now()
            });
            
            // 直近15回分を保持
            if (dodgeHistory.length > 15) {
                dodgeHistory.shift();
            }
            
            // 平均回避ベクトルを更新（指数移動平均）
            const alpha = 0.3;  // 新しいデータの重み
            averageDodgeVector.x = averageDodgeVector.x * (1 - alpha) + relativeX * alpha;
            averageDodgeVector.y = averageDodgeVector.y * (1 - alpha) + relativeY * alpha;
            
            lastDodgeVector = currentVector;
            
            updateTendencyDisplay();
        }
        
        // 学習した傾向から予測オフセットを計算（相対位置ベース）
        function calculateLearnedOffset() {
            if (dodgeHistory.length < 2) return { x: 0, y: 0 };
            
            let predictedX = 0;
            let predictedY = 0;
            
            // 直前の回避後のパターンを優先（交互パターン検出）
            if (lastDodgeVector && afterDodgePatterns.length >= 3) {
                // 類似した直前ベクトルからの次の動きを探す
                let similarCount = 0;
                let sumX = 0, sumY = 0;
                
                for (const pattern of afterDodgePatterns) {
                    // 直前のベクトルが類似しているか
                    const dotProduct = (pattern.prev.x * lastDodgeVector.x + pattern.prev.y * lastDodgeVector.y);
                    const mag1 = Math.hypot(pattern.prev.x, pattern.prev.y);
                    const mag2 = Math.hypot(lastDodgeVector.x, lastDodgeVector.y);
                    
                    if (mag1 > 0 && mag2 > 0) {
                        const similarity = dotProduct / (mag1 * mag2);
                        if (similarity > 0.5) {  // 方向が似ている
                            sumX += pattern.next.x;
                            sumY += pattern.next.y;
                            similarCount++;
                        }
                    }
                }
                
                if (similarCount >= 2) {
                    // 類似パターンの平均を予測として使用
                    predictedX = (sumX / similarCount) * learningStrength;
                    predictedY = (sumY / similarCount) * learningStrength;
                    return { x: predictedX, y: predictedY };
                }
            }
            
            // フォールバック：平均回避ベクトルを使用
            const avgMag = Math.hypot(averageDodgeVector.x, averageDodgeVector.y);
            if (avgMag > 20) {
                predictedX = averageDodgeVector.x * learningStrength;
                predictedY = averageDodgeVector.y * learningStrength;
            }
            
            return { x: predictedX, y: predictedY };
        }
        
        // 傾向表示を更新
        function updateTendencyDisplay() {
            let text = '';
            
            if (dodgeHistory.length < 2) {
                text = 'データ収集中...';
            } else {
                const avgMag = Math.hypot(averageDodgeVector.x, averageDodgeVector.y);
                
                if (avgMag > 20) {
                    const direction = classifyDodgeDirection(averageDodgeVector.x, averageDodgeVector.y);
                    const strength = Math.min(100, Math.round(avgMag / bulletSize * 100));
                    text = `${direction}方向に避ける傾向 (${strength}%)`;
                } else {
                    text = 'パターン分散中';
                }
                
                // 交互パターンを検出
                if (lastDodgeVector && afterDodgePatterns.length >= 3) {
                    // 直前と逆方向に避ける傾向をチェック
                    let reverseCount = 0;
                    for (const pattern of afterDodgePatterns.slice(-5)) {
                        const dot = pattern.prev.x * pattern.next.x + pattern.prev.y * pattern.next.y;
                        if (dot < 0) reverseCount++;  // 逆方向
                    }
                    
                    if (reverseCount >= 3) {
                        text += '\n🔄 反転パターン検出';
                    }
                }
            }
            
            document.getElementById('tendencyText').textContent = text;
        }
        
        // 改善された速度計算
        function updateMotionTracking(x, y) {
            const now = Date.now();
            positionHistory.push({ x, y, time: now });
            
            while (positionHistory.length > HISTORY_SIZE) {
                positionHistory.shift();
            }
            
            if (positionHistory.length < 3) return;
            
            const recent = positionHistory.slice(-3);
            const dt = (recent[2].time - recent[0].time) / 1000;
            
            if (dt > 0 && dt < 0.2) {
                const instantVx = (recent[2].x - recent[0].x) / dt;
                const instantVy = (recent[2].y - recent[0].y) / dt;
                
                const maxVelocity = canvas.width * MAX_VELOCITY_RATIO;
                const clampedVx = Math.max(-maxVelocity, Math.min(maxVelocity, instantVx));
                const clampedVy = Math.max(-maxVelocity, Math.min(maxVelocity, instantVy));
                
                const prevVx = smoothedVelocity.x;
                const prevVy = smoothedVelocity.y;
                
                smoothedVelocity.x = smoothedVelocity.x * (1 - VELOCITY_SMOOTHING) + clampedVx * VELOCITY_SMOOTHING;
                smoothedVelocity.y = smoothedVelocity.y * (1 - VELOCITY_SMOOTHING) + clampedVy * VELOCITY_SMOOTHING;
                
                if (dt > 0) {
                    const instantAx = (smoothedVelocity.x - prevVx) / dt;
                    const instantAy = (smoothedVelocity.y - prevVy) / dt;
                    
                    smoothedAcceleration.x = smoothedAcceleration.x * (1 - ACCEL_SMOOTHING) + instantAx * ACCEL_SMOOTHING;
                    smoothedAcceleration.y = smoothedAcceleration.y * (1 - ACCEL_SMOOTHING) + instantAy * ACCEL_SMOOTHING;
                }
            }
        }
        
        // 改善された予測位置計算
        function calculatePredictedPosition(timeToImpactMs) {
            const basePos = currentFacePosition || lastKnownFacePosition;
            if (!basePos) return basePos;
            
            // 1発目は必ず中心を狙う
            if (shotCount === 0) {
                return { x: basePos.x, y: basePos.y };
            }
            
            if (predictionLevel === 0 && learningStrength === 0) {
                return basePos;
            }
            
            let predictedX = basePos.x;
            let predictedY = basePos.y;
            
            // 動き予測
            if (predictionLevel > 0 && positionHistory.length >= 5) {
                const predFactor = PREDICTION_LEVELS[predictionLevel].factor;
                const t = (timeToImpactMs / 1000) * predFactor;
                
                let consistencyFactor = 1.0;
                if (positionHistory.length >= 10) {
                    const older = positionHistory.slice(-10, -5);
                    const newer = positionHistory.slice(-5);
                    
                    const olderDir = Math.atan2(
                        older[older.length-1].y - older[0].y,
                        older[older.length-1].x - older[0].x
                    );
                    const newerDir = Math.atan2(
                        newer[newer.length-1].y - newer[0].y,
                        newer[newer.length-1].x - newer[0].x
                    );
                    
                    let dirDiff = Math.abs(newerDir - olderDir);
                    if (dirDiff > Math.PI) dirDiff = 2 * Math.PI - dirDiff;
                    
                    if (dirDiff > Math.PI / 3) consistencyFactor = 0.5;
                    else if (dirDiff > Math.PI / 6) consistencyFactor = 0.75;
                }
                
                const speed = Math.hypot(smoothedVelocity.x, smoothedVelocity.y);
                const minSpeed = canvas.width * 0.05;
                if (speed < minSpeed) {
                    consistencyFactor *= speed / minSpeed;
                }
                
                const effectiveT = t * consistencyFactor;
                predictedX += smoothedVelocity.x * effectiveT + 0.5 * smoothedAcceleration.x * effectiveT * effectiveT * 0.5;
                predictedY += smoothedVelocity.y * effectiveT + 0.5 * smoothedAcceleration.y * effectiveT * effectiveT * 0.5;
                
                // ノイズ
                const noiseAmount = speed * effectiveT * predictionNoise;
                predictedX += (Math.random() - 0.5) * 2 * noiseAmount;
                predictedY += (Math.random() - 0.5) * 2 * noiseAmount;
            }
            
            // 学習した回避パターンを適用
            const learnedOffset = calculateLearnedOffset();
            predictedX += learnedOffset.x;
            predictedY += learnedOffset.y;
            
            // 画面内に収める
            const margin = bulletSize;
            predictedX = Math.max(margin, Math.min(canvas.width - margin, predictedX));
            predictedY = Math.max(margin, Math.min(canvas.height - margin, predictedY));
            
            return { x: predictedX, y: predictedY };
        }
        
        // モバイル判定
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || window.innerWidth <= 768;
        }
        
        async function initCamera() {
            try {
                // モバイル向けに解像度を調整
                const constraints = {
                    video: {
                        width: { ideal: isMobile() ? 640 : 1280 },
                        height: { ideal: isMobile() ? 480 : 720 },
                        facingMode: 'user'
                    }
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    updateVideoSize();
                };
                document.getElementById('permissionScreen').classList.add('hidden');
                initFaceDetection();
            } catch (err) {
                document.getElementById('statusText').textContent = 'カメラエラー: ' + err.message;
            }
        }
        
        // ビデオサイズをレスポンシブに更新
        function updateVideoSize() {
            if (!isRunning) {
                const container = document.querySelector('.video-container');
                const isLandscapeMobile = window.innerWidth <= 932 && window.innerWidth > window.innerHeight;
                
                if (isLandscapeMobile) {
                    // 横画面モバイル：フルスクリーン
                    video.style.width = '100vw';
                    video.style.height = '100vh';
                    canvas.style.width = '100vw';
                    canvas.style.height = '100vh';
                } else if (isMobile()) {
                    // 縦画面モバイル
                    const maxWidth = window.innerWidth - 20;
                    const aspectRatio = video.videoHeight / video.videoWidth;
                    const height = Math.min(maxWidth * aspectRatio, window.innerHeight * 0.4);
                    video.style.width = maxWidth + 'px';
                    video.style.height = height + 'px';
                    canvas.style.width = maxWidth + 'px';
                    canvas.style.height = height + 'px';
                } else {
                    // PC
                    video.style.width = '';
                    video.style.height = '';
                    canvas.style.width = '';
                    canvas.style.height = '';
                }
            }
        }
        
        // パネル開閉
        function togglePanel() {
            const panel = document.getElementById('controlPanel');
            const btn = document.getElementById('panelToggleBtn');
            
            panel.classList.toggle('hidden-panel');
            btn.classList.toggle('panel-hidden');
            
            if (panel.classList.contains('hidden-panel')) {
                btn.textContent = '▶';
            } else {
                btn.textContent = '◀';
            }
        }
        
        function initFaceDetection() {
            faceDetection = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
            faceDetection.onResults(onResults);
            processFrame();
            document.getElementById('statusDot').classList.add('ready');
            document.getElementById('statusText').textContent = '準備完了 - 開始ボタンを押してください';
            document.getElementById('startBtn').disabled = false;
            
            // モバイル向けデフォルト設定を適用
            if (isMobile()) {
                // 弾サイズを小さめに
                bulletSize = 60;
                document.getElementById('bulletSizeSlider').value = 60;
                document.getElementById('bulletSizeValue').textContent = '60px';
                
                // 狙いズレを少し小さめに
                aimOffset = 40;
                document.getElementById('aimOffsetSlider').value = 40;
                document.getElementById('aimOffsetValue').textContent = '40px';
            }
        }
        
        async function processFrame() {
            if (video.readyState >= 2) await faceDetection.send({ image: video });
            requestAnimationFrame(processFrame);
        }
        
        function onResults(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.detections && results.detections.length > 0) {
                const bbox = results.detections[0].boundingBox;
                const centerX = bbox.xCenter * canvas.width;
                const centerY = bbox.yCenter * canvas.height;
                currentFacePosition = { x: centerX, y: centerY };
                lastKnownFacePosition = { x: centerX, y: centerY };
                currentFaceSize = (bbox.height * canvas.height) / canvas.height;
                
                if (isRunning) {
                    updateMotionTracking(centerX, centerY);
                }
                
                checkDistance();
                
                if (isRunning && !isRespawning) {
                    drawCloverLife(centerX, centerY);
                }
            } else {
                currentFacePosition = null;
                currentFaceSize = 0;
            }
            
            if (isRunning) {
                updateAndDrawBullets();
            }
        }
        
        function getLifeRadius() {
            return Math.max(60, currentFaceSize * canvas.height * 0.9);
        }
        
        function drawCloverLife(faceX, faceY) {
            const radius = getLifeRadius();
            const colors = ['rgba(0, 220, 255, 0.5)', 'rgba(0, 180, 255, 0.5)', 'rgba(0, 220, 255, 0.5)', 'rgba(0, 180, 255, 0.5)'];
            
            for (let i = 0; i < 4; i++) {
                const q = QUADRANTS[i];
                const startAngle = q.startAngle + QUADRANT_GAP;
                const endAngle = q.endAngle - QUADRANT_GAP;
                
                if (lives[i]) {
                    ctx.fillStyle = colors[i];
                    ctx.beginPath();
                    ctx.moveTo(faceX, faceY);
                    ctx.arc(faceX, faceY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(0, 255, 255, 1)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(faceX, faceY, radius, startAngle, endAngle);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = 'rgba(100, 100, 100, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.arc(faceX, faceY, radius, startAngle, endAngle);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.lineWidth = 5;
            for (let i = 0; i < 4; i++) {
                const angle = QUADRANTS[i].startAngle;
                ctx.beginPath();
                ctx.moveTo(faceX, faceY);
                ctx.lineTo(faceX + Math.cos(angle) * radius, faceY + Math.sin(angle) * radius);
                ctx.stroke();
            }
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                const angle = QUADRANTS[i].startAngle;
                ctx.beginPath();
                ctx.moveTo(faceX, faceY);
                ctx.lineTo(faceX + Math.cos(angle) * radius, faceY + Math.sin(angle) * radius);
                ctx.stroke();
            }
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(faceX, faceY, 6, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function getRemainingLives() { return lives.filter(l => l).length; }
        
        function normalizeAngle(angle) {
            while (angle > Math.PI) angle -= 2 * Math.PI;
            while (angle < -Math.PI) angle += 2 * Math.PI;
            return angle;
        }
        
        function isPointInQuadrant(px, py, centerX, centerY, radius, qIndex) {
            const dx = px - centerX;
            const dy = py - centerY;
            const distance = Math.hypot(dx, dy);
            
            if (distance > radius) return false;
            if (distance < radius * 0.1) return true;
            
            const angle = Math.atan2(dy, dx);
            const q = QUADRANTS[qIndex];
            const startAngle = q.startAngle + QUADRANT_GAP;
            const endAngle = q.endAngle - QUADRANT_GAP;
            
            if (qIndex === 3) {
                return angle >= startAngle || angle <= normalizeAngle(endAngle);
            }
            
            return angle >= startAngle && angle <= endAngle;
        }
        
        function checkCircleQuadrantIntersection(cx, cy, cr, faceX, faceY, lifeRadius, qIndex) {
            const q = QUADRANTS[qIndex];
            const startAngle = q.startAngle + QUADRANT_GAP;
            const endAngle = q.endAngle - QUADRANT_GAP;
            
            if (isPointInQuadrant(cx, cy, faceX, faceY, lifeRadius, qIndex)) {
                return true;
            }
            
            const distToCenter = Math.hypot(cx - faceX, cy - faceY);
            if (Math.abs(distToCenter - lifeRadius) <= cr) {
                const angleToCircle = Math.atan2(cy - faceY, cx - faceX);
                let inArc = false;
                if (qIndex === 3) {
                    inArc = angleToCircle >= startAngle || angleToCircle <= normalizeAngle(endAngle);
                } else {
                    inArc = angleToCircle >= startAngle && angleToCircle <= endAngle;
                }
                if (inArc) return true;
            }
            
            const checkLineCircle = (angle) => {
                const dirX = Math.cos(angle);
                const dirY = Math.sin(angle);
                const toCenterX = cx - faceX;
                const toCenterY = cy - faceY;
                const t = Math.max(0, Math.min(lifeRadius, toCenterX * dirX + toCenterY * dirY));
                const closestX = faceX + dirX * t;
                const closestY = faceY + dirY * t;
                const dist = Math.hypot(cx - closestX, cy - closestY);
                return dist <= cr;
            };
            
            if (checkLineCircle(startAngle) || checkLineCircle(endAngle)) {
                return true;
            }
            
            const samplePoints = 24;
            for (let i = 0; i < samplePoints; i++) {
                const angle = (i / samplePoints) * Math.PI * 2;
                const px = cx + Math.cos(angle) * cr;
                const py = cy + Math.sin(angle) * cr;
                if (isPointInQuadrant(px, py, faceX, faceY, lifeRadius, qIndex)) {
                    return true;
                }
            }
            
            for (let r = 0.3; r <= 0.7; r += 0.2) {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const px = cx + Math.cos(angle) * cr * r;
                    const py = cy + Math.sin(angle) * cr * r;
                    if (isPointInQuadrant(px, py, faceX, faceY, lifeRadius, qIndex)) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        function getHitQuadrants(bulletX, bulletY, bulletRadius, faceX, faceY) {
            const hitQuadrants = [];
            const lifeRadius = getLifeRadius();
            
            for (let i = 0; i < 4; i++) {
                if (!lives[i]) continue;
                if (checkCircleQuadrantIntersection(bulletX, bulletY, bulletRadius, faceX, faceY, lifeRadius, i)) {
                    hitQuadrants.push(i);
                }
            }
            return hitQuadrants;
        }
        
        function fireBurst() {
            if (!isRunning) return;
            
            const targetPos = currentFacePosition || lastKnownFacePosition;
            if (!targetPos) return;
            
            const burstCount = Math.floor(Math.random() * maxBurstCount) + 1;
            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => fireSingleBullet(), i * BURST_DELAY);
            }
        }
        
        function fireSingleBullet() {
            if (!isRunning) return;
            
            const basePos = currentFacePosition || lastKnownFacePosition;
            if (!basePos) return;
            
            // 予測位置を計算
            const predictedPos = calculatePredictedPosition(impactTime);
            
            // 1発目はオフセットなし
            let offsetX = 0;
            let offsetY = 0;
            if (shotCount > 0) {
                offsetX = (Math.random() - 0.5) * 2 * aimOffset;
                offsetY = (Math.random() - 0.5) * 2 * aimOffset;
            }
            
            activeBullets.push({
                targetX: predictedPos.x + offsetX,
                targetY: predictedPos.y + offsetY,
                originalTarget: { x: predictedPos.x + offsetX, y: predictedPos.y + offsetY },
                startTime: Date.now(),
                impactTime: impactTime,
                maxSize: bulletSize,
                resolved: false,
                isPredicted: predictionLevel > 0 || (shotCount > 0 && learningStrength > 0),
                shotIndex: shotCount
            });
            
            shotCount++;
        }
        
        function updateAndDrawBullets() {
            const now = Date.now();
            activeBullets = activeBullets.filter(bullet => {
                if (bullet.resolved) return false;
                const elapsed = now - bullet.startTime;
                const progress = Math.min(elapsed / bullet.impactTime, 1);
                
                drawBullet(bullet, progress);
                
                if (progress >= 1) {
                    bullet.resolved = true;
                    checkImpact(bullet);
                    return false;
                }
                return true;
            });
        }
        
        function drawBullet(bullet, progress) {
            const x = bullet.targetX;
            const y = bullet.targetY;
            const currentSize = bullet.maxSize * progress;
            const isPredicted = bullet.isPredicted;
            
            if (progress < 0.25) {
                const alpha = Math.sin(progress * Math.PI * 12) * 0.5 + 0.5;
                ctx.strokeStyle = isPredicted 
                    ? `rgba(255, 100, 255, ${alpha})`
                    : `rgba(255, 200, 0, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 4]);
                ctx.beginPath();
                ctx.arc(x, y, bullet.maxSize, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.strokeStyle = isPredicted 
                    ? `rgba(255, 100, 255, ${alpha * 0.8})`
                    : `rgba(255, 200, 0, ${alpha * 0.8})`;
                ctx.lineWidth = 2;
                const cs = bullet.maxSize * 0.6;
                ctx.beginPath();
                ctx.moveTo(x - cs, y); ctx.lineTo(x + cs, y);
                ctx.moveTo(x, y - cs); ctx.lineTo(x, y + cs);
                ctx.stroke();
            }
            
            if (progress >= 0.25) {
                const gp = (progress - 0.25) / 0.75;
                const size = bullet.maxSize * 0.2 + currentSize * 0.8;
                
                const r = isPredicted ? 255 : 255;
                const g = isPredicted ? Math.floor(50 * (1 - gp)) : Math.floor(120 * (1 - gp));
                const b = isPredicted ? Math.floor(255 * (1 - gp * 0.5)) : Math.floor(30 * (1 - gp));
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 1.3);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.9)`);
                gradient.addColorStop(0.6, `rgba(${r}, ${g}, ${b}, 0.4)`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, size * 1.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + gp * 0.4})`;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.25, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = isPredicted 
                    ? `rgba(255, 50, 255, ${0.5 + gp * 0.5})`
                    : `rgba(255, 50, 50, ${0.5 + gp * 0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, bullet.maxSize * 0.5, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            if (progress > 0.75) {
                const alpha = Math.sin((progress - 0.75) / 0.25 * Math.PI * 6) * 0.6 + 0.4;
                ctx.strokeStyle = isPredicted 
                    ? `rgba(255, 0, 255, ${alpha})`
                    : `rgba(255, 0, 0, ${alpha})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(x, y, bullet.maxSize * 1.15, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        function checkImpact(bullet) {
            if (isRespawning) return;
            
            // 回避パターンを学習（被弾時も回避時も）
            if (currentFacePosition) {
                learnDodgePattern(bullet, currentFacePosition);
            }
            
            if (!currentFacePosition) {
                if (lastKnownFacePosition) {
                    const remaining = lives.map((l, i) => l ? i : -1).filter(i => i >= 0);
                    if (remaining.length > 0) {
                        onHit(bullet, [remaining[Math.floor(Math.random() * remaining.length)]]);
                    }
                }
                return;
            }
            
            const hitQuadrants = getHitQuadrants(
                bullet.targetX, bullet.targetY,
                bullet.maxSize * 0.5,
                currentFacePosition.x, currentFacePosition.y
            );
            
            if (hitQuadrants.length > 0) {
                onHit(bullet, hitQuadrants);
            } else {
                onDodge(bullet);
            }
        }
        
        function onDodge(bullet) {
            successCount++;
            reactionTimes.push(bullet.impactTime);
            document.getElementById('liveSuccess').textContent = successCount;
            document.getElementById('hitFlash').className = 'hit-flash success';
            setTimeout(() => document.getElementById('hitFlash').className = 'hit-flash', 300);
        }
        
        function onHit(bullet, hitQuadrants) {
            failCount++;
            document.getElementById('liveFail').textContent = failCount;
            for (const qi of hitQuadrants) lives[qi] = false;
            updateLifeDisplay();
            document.getElementById('hitFlash').className = 'hit-flash fail';
            setTimeout(() => document.getElementById('hitFlash').className = 'hit-flash', 300);
            if (getRemainingLives() <= 0) onKO();
        }
        
        function onKO() {
            koCount++;
            isRespawning = true;
            document.getElementById('koOverlay').classList.add('show');
            
            respawnTimer = setTimeout(() => {
                lives = [true, true, true, true];
                updateLifeDisplay();
                isRespawning = false;
                document.getElementById('koOverlay').classList.remove('show');
            }, 2000);
        }
        
        function updateLifeDisplay() {
            ['lifeTop', 'lifeRight', 'lifeBottom', 'lifeLeft'].forEach((id, i) => {
                document.getElementById(id).classList.toggle('lost', !lives[i]);
            });
        }
        
        function checkDistance() {
            const warning = document.getElementById('distanceWarning');
            if (currentFaceSize < IDEAL_FACE_MIN) {
                warning.textContent = '📷 もっと近づいてください';
                warning.classList.add('show');
            } else if (currentFaceSize > IDEAL_FACE_MAX) {
                warning.textContent = '📷 もっと離れてください';
                warning.classList.add('show');
            } else {
                warning.classList.remove('show');
            }
        }
        
        async function startCountdown() {
            const overlay = document.getElementById('countdownOverlay');
            const num = document.getElementById('countdownNumber');
            overlay.classList.add('show');
            for (let i = 3; i >= 1; i--) {
                num.textContent = i;
                num.style.animation = 'none';
                num.offsetHeight;
                num.style.animation = 'countdownPop 1s ease';
                await new Promise(r => setTimeout(r, 1000));
            }
            num.textContent = 'GO!';
            num.style.animation = 'none';
            num.offsetHeight;
            num.style.animation = 'countdownPop 1s ease';
            await new Promise(r => setTimeout(r, 500));
            overlay.classList.remove('show');
        }
        
        async function startTraining() {
            successCount = 0; failCount = 0; reactionTimes = [];
            remainingTime = 80; activeBullets = [];
            lives = [true, true, true, true];
            koCount = 0; isRespawning = false;
            positionHistory = [];
            smoothedVelocity = { x: 0, y: 0 };
            smoothedAcceleration = { x: 0, y: 0 };
            lastKnownFacePosition = currentFacePosition;
            
            // 学習データをリセット
            shotCount = 0;
            dodgeHistory = [];
            averageDodgeVector = { x: 0, y: 0 };
            lastDodgeVector = null;
            afterDodgePatterns = [];
            document.getElementById('tendencyText').textContent = 'データ収集中';
            
            document.getElementById('liveSuccess').textContent = '0';
            document.getElementById('liveFail').textContent = '0';
            updateLifeDisplay();
            
            document.body.classList.add('training-active');
            document.getElementById('mainContainer').classList.add('training-mode');
            document.getElementById('timerDisplay').style.display = 'block';
            document.getElementById('scoreDisplay').style.display = 'block';
            document.getElementById('lifeDisplay').style.display = 'block';
            document.getElementById('aiLevelDisplay').style.display = 'block';
            document.getElementById('aiLearningDisplay').style.display = 'block';
            document.getElementById('aiLevelName').textContent = PREDICTION_LEVELS[predictionLevel].name;
            document.getElementById('stopTrainingBtn').style.display = 'block';
            document.getElementById('panelToggleBtn').style.display = 'none';
            document.getElementById('timerDisplay').textContent = '80';
            document.getElementById('timerDisplay').className = 'timer-display';
            
            // フルスクリーンキャンバスサイズを設定
            setFullscreenCanvas();
            
            await startCountdown();
            isRunning = true;
            
            trainingTimer = setInterval(() => {
                remainingTime--;
                document.getElementById('timerDisplay').textContent = remainingTime;
                if (remainingTime <= 10) {
                    document.getElementById('timerDisplay').className = 'timer-display critical';
                } else if (remainingTime <= 20) {
                    document.getElementById('timerDisplay').className = 'timer-display warning';
                }
                if (remainingTime <= 0) endTraining();
            }, 1000);
            
            setTimeout(fireBurst, 500);
            fireTimer = setInterval(fireBurst, fireInterval);
        }
        
        function stopTraining() { endTraining(); }
        
        function endTraining() {
            isRunning = false; isRespawning = false;
            clearInterval(trainingTimer);
            clearInterval(fireTimer);
            clearTimeout(respawnTimer);
            activeBullets = [];
            positionHistory = [];
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('scoreDisplay').style.display = 'none';
            document.getElementById('lifeDisplay').style.display = 'none';
            document.getElementById('aiLevelDisplay').style.display = 'none';
            document.getElementById('aiLearningDisplay').style.display = 'none';
            document.getElementById('stopTrainingBtn').style.display = 'none';
            document.getElementById('panelToggleBtn').style.display = '';
            document.getElementById('koOverlay').classList.remove('show');
            document.body.classList.remove('training-active');
            document.getElementById('mainContainer').classList.remove('training-mode');
            
            // モバイルでビデオサイズを復元
            setTimeout(updateVideoSize, 100);
            
            showResults();
        }
        
        function showResults() {
            const avg = reactionTimes.length > 0 
                ? (reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length / 1000).toFixed(2) + 's' : '-';
            document.getElementById('resultSuccess').textContent = successCount;
            document.getElementById('resultFail').textContent = failCount;
            document.getElementById('resultKO').textContent = koCount;
            document.getElementById('resultAvg').textContent = avg;
            document.getElementById('resultScreen').classList.add('show');
        }
        
        function backToMenu() { document.getElementById('resultScreen').classList.remove('show'); }
        
        function updateLearningStrength() {
            const v = parseInt(document.getElementById('learningStrengthSlider').value);
            learningStrength = v / 100;
            document.getElementById('learningStrengthValue').textContent = v + '%';
        }
        
        function updatePredictionLevel() {
            const v = parseInt(document.getElementById('predictionLevelSlider').value);
            predictionLevel = v;
            const level = PREDICTION_LEVELS[v];
            document.getElementById('predictionLevelValue').textContent = level.name;
            document.getElementById('predictionDescription').textContent = level.description;
        }
        
        function updatePredictionNoise() {
            const v = parseInt(document.getElementById('predictionNoiseSlider').value);
            predictionNoise = v / 100;
            document.getElementById('predictionNoiseValue').textContent = v + '%';
        }
        
        function updateImpactTime() {
            const v = document.getElementById('impactTimeSlider').value;
            impactTime = parseFloat(v) * 1000;
            document.getElementById('impactTimeValue').textContent = v + '秒';
        }
        
        function updateBulletSize() {
            const v = document.getElementById('bulletSizeSlider').value;
            bulletSize = parseInt(v);
            document.getElementById('bulletSizeValue').textContent = v + 'px';
        }
        
        function updateFireInterval() {
            const v = document.getElementById('fireIntervalSlider').value;
            fireInterval = parseFloat(v) * 1000;
            document.getElementById('fireIntervalValue').textContent = v + '秒';
        }
        
        function updateAimOffset() {
            const v = document.getElementById('aimOffsetSlider').value;
            aimOffset = parseInt(v);
            document.getElementById('aimOffsetValue').textContent = v + 'px';
        }
        
        function updateBurstCount() {
            const v = document.getElementById('burstCountSlider').value;
            maxBurstCount = parseInt(v);
            document.getElementById('burstCountValue').textContent = '1〜' + v + '発';
        }
        
        // フルスクリーンキャンバスサイズを設定
        function setFullscreenCanvas() {
            // 実際の画面サイズを取得（アドレスバーなども考慮）
            const width = window.innerWidth || document.documentElement.clientWidth;
            const height = window.innerHeight || document.documentElement.clientHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            // ビデオ要素も明示的にサイズ設定
            video.style.width = width + 'px';
            video.style.height = height + 'px';
        }
        
        // リサイズと画面回転対応
        window.addEventListener('resize', () => {
            if (isRunning) {
                setFullscreenCanvas();
            } else {
                updateVideoSize();
            }
        });
        
        window.addEventListener('orientationchange', () => {
            // 少し遅延させて正確なサイズを取得
            setTimeout(() => {
                if (isRunning) {
                    setFullscreenCanvas();
                } else {
                    updateVideoSize();
                }
            }, 150);
        });
        
        // フルスクリーンAPI対応（iOS Safari用）
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }
        
        // タッチでのスクロール防止（トレーニング中）
        document.addEventListener('touchmove', (e) => {
            if (isRunning) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // iOS用：アドレスバーを隠すためのスクロール
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.scrollTo(0, 1);
            }, 100);
        });
        
        // iOS Safari対応：正確なvh単位を設定
        function setVH() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        setVH();
        window.addEventListener('resize', setVH);
        window.addEventListener('orientationchange', () => {
            setTimeout(setVH, 150);
        });
    </script>
</body>
</html>
